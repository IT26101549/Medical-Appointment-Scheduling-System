<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Sign In | Northern Care</title>
  <link rel="stylesheet" href="/login.css?v=northern-care-2">
  <link rel="icon" type="image/svg+xml" href="/northern-care-mark.svg">
</head>
<body>
  <main>
    <div class="brand">
      <img src="/northern-care-logo.svg" width="200" height="146" alt="Northern Care">
    </div>
    <h1>Admin sign in</h1>
    <p>Enter username and password</p>
    {{ERROR}}
    <form method="post" action="/login">
      <input type="hidden" name="token" value="{{TOKEN}}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
