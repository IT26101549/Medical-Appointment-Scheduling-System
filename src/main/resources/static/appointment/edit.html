<main><section class="panel"><h2>Reschedule appointment</h2><p id="info" class="muted">Loading appointment...</p>
<form id="form" class="form-grid"><div class="field"><label for="date">New Date</label><input type="date" id="date" required></div><div class="field"><label for="time">New Time</label><input type="time" id="time" required></div><div class="field full"><div class="actions"><button type="submit">Save Changes</button><a class="btn secondary" href="/appointment/appointments.html">Back to List</a></div></div></form>
<div id="message" class="notice" role="status"></div>
</section></main><script src="/appointment/app.js?v=admin-login"></script>
<script>
const id=new URLSearchParams(location.search).get("id");
document.getElementById("date").min=localToday();
async function load(){
    if(!id || !/^\d+$/.test(id)){message("Invalid appointment ID.",true);document.getElementById("form").hidden=true;return;}
    try{
        const a=await request("/"+id);
        document.getElementById("info").textContent="Appointment #"+a.id+" · "+a.patientName+" · "+a.doctorName;
        document.getElementById("date").value=a.date;
        document.getElementById("time").value=a.time;
        if(a.status!=="Cancelled") window.hospitalNotify("Editing appointment #" + id + ".", "info");
        if(a.status==="Cancelled"){message("Cancelled appointments cannot be rescheduled.",true);document.getElementById("form").hidden=true;}
    }catch(e){message(e.message,true);document.getElementById("form").hidden=true;}
}
document.getElementById("form").addEventListener("submit",async e=>{
    e.preventDefault();
    const chosenDate = document.getElementById("date").value;
    const chosenTime = document.getElementById("time").value;
    if (!chosenDate || !chosenTime || new Date(chosenDate + "T" + chosenTime + ":00") <= new Date()) {
      message("Choose a future appointment date and time.", true);
      return;
    }
    try{
        await request("/"+id,"PUT",{date:document.getElementById("date").value,time:document.getElementById("time").value});
        message("Appointment successfully rescheduled.");
    }catch(err){message(err.message,true);}
});
load();
</script></div></div></div></div></body></html>
